[workspace]
resolver = "3"
members = ["bin/proto", "bin/server", "bin/client"]

[workspace.package]
version = "0.1.0"
edition = "2024"

[workspace.dependencies]
proto = { path = "bin/proto" }
server = { path = "bin/server" }
client = { path = "bin/client" }
clap = { version = "4.6.7", features = ["derive"] }
prost = "0.14.4"
protox = "0.10.0"
shred-core = { git = "https://github.com/vyralabshq/shred-core", tag = "v0.4.0", features = ["live"] }
solana-transaction = { version = "5.1.0", features = ["wincode"] }
thiserror = "2.0.21"
tokio = { version = "1.54.1", features = ["macros", "rt-multi-thread", "net", "time", "sync", "signal"] }
tokio-stream = { version = "0.1.19", features = ["net", "sync"] }
tonic = "0.14.6"
tonic-prost = "0.14.6"
tonic-prost-build = "0.14.6"
wincode = "0.6.2"
